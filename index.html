<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuiļa dzīve</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #d6d5d5;
  color: #6b0000;
}

h1 {
  color: #8c0000;
font-size: 40px;
}

.noteikumi {
  background-color: #c0cfdd;
  color: #222222;
  padding: 12px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border: 6px dashed #94a3b8;
  border-radius: 12px;
  margin: 20px auto;
  max-width: 100%;
  text-align: center;
  background-color: #f8fafc;
  box-sizing: border-box;
}

button {
  background-color: #132a41;
  color: #ffffff;
  border-radius: 8px;
  border: 0;
}
button:hover { outline: 5px solid #4d5662; }
</style>
</head>
<body>
<h1>Kuiļa dzīve</h1>
<p>Īss spēles mērķa apraksts spēlētājam.</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Ergo ir parasts kuilis, viņam ir javac punkti un jameiģina vinēt</p>
  <p>Ergo vinē kad savac 20 punktus</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="atteli/varonis.png" alt="Ergo" width="128">
  <p>Punktu vajadziga daudzuma sasniegšana:</p>
  <audio controls src="skanas/wewe.mp3"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Savākt punktu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
