<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuiļa pārbaudes stacija</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 4px; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* MAINI ŠEIT: lapas un kartītes krāsas */
body {
  background-color: #c2cbd5;
  color: #17212b;
}

.kartite {
  background-color: #cad2d2;
  border: 2px solid #6e9dd3;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
  box-sizing: border-box;
}

button {
  background-color: #006ad4;
  color: #fffdfd;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<h1>Kuiļa pārbaudes stacija</h1>
<p>Sakārto attēlu un skaņu apakšmapēs tā, lai visas lapas daļas turpinātu darboties.</p>
<div class="kartite">
  <h2>Varoņa attēls</h2>
  <img src="atteli/varonis.svg" alt="Zils kvadrātveida robots" width="128">
  <h2>Signāla skaņa</h2>
  <audio controls src="skanas/klikskis.wav"></audio>
  <p id="punkti">Pārbaudes klikšķi: 0</p>
  <button onclick="pieskaitit()">Pārbaudīt pogu</button>
</div>
<script>
// Gatava pārbaudes poga — šo skriptu nemaini.
let punkti = 0;
function pieskaitit() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Pārbaudes klikšķi: " + punkti;
}
</script>
</body>
</html>
